<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atlas AI — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        width: 340px;
        padding: 36px;
        animation: fadeUp 0.5s ease both;
    }
    .login-card .mark {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: linear-gradient(90deg, var(--accent), #a7f3eb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .login-card p.subtitle {
        margin: 6px 0 26px;
        color: var(--muted);
        font-size: 13px;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        margin-top: 16px;
    }
    input {
        width: 100%;
        padding: 11px 13px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        font-size: 14px;
    }
    input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.15);
    }
    button {
        width: 100%;
        margin-top: 26px;
        padding: 12px;
        border-radius: var(--radius-sm);
        border: none;
        background: var(--accent);
        color: #06201d;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: opacity 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover {
        opacity: 0.92;
        box-shadow: 0 0 20px rgba(79, 209, 197, 0.3);
    }
    .error {
        margin-top: 18px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: var(--red);
        font-size: 13px;
    }
</style>
</head>
<body>
    <div class="card login-card glass">
        <div class="mark">ATLAS AI</div>
        <p class="subtitle">Sign in to view your trading books</p>
        <form method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Sign in</button>
        </form>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
