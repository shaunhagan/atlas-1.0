<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atlas AI — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        --bg: #0b0f14;
        --panel: #131a22;
        --border: #232d38;
        --text: #e8edf2;
        --muted: #8a99a8;
        --accent: #4fd1c5;
        --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
        width: 340px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
    }
    h1 {
        font-size: 20px;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
    }
    p.subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
    }
    label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        margin-top: 16px;
    }
    input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0e141b;
        color: var(--text);
        font-size: 14px;
    }
    input:focus {
        outline: none;
        border-color: var(--accent);
    }
    button {
        width: 100%;
        margin-top: 24px;
        padding: 11px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #06201d;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .error {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: var(--danger);
        font-size: 13px;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>Atlas AI</h1>
        <p class="subtitle">Sign in to view your trading books</p>
        <form method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Sign in</button>
        </form>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
